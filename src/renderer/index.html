<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Glance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Pointer reticle -->
  <div id="reticle" hidden>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="dot"></div>
    <div id="reticle-label" hidden></div>
  </div>

  <!-- Collapsed pill -->
  <button id="pill" class="interactive" title="Open Glance">
    <span class="logo">◉</span> Glance <kbd id="hotkey"></kbd>
  </button>

  <!-- Guidance panel -->
  <section id="panel" class="interactive" hidden>
    <header>
      <span class="logo">◉</span>
      <strong>Glance</strong>
      <span id="model" class="badge"></span>
      <button id="btn-close" class="icon" title="Close (Esc)">✕</button>
    </header>

    <form id="goal-form" autocomplete="off">
      <input id="goal-input" type="text" placeholder="What do you want to do?" />
      <button type="button" id="mic" class="icon" title="Speak your goal">🎤</button>
    </form>

    <div class="goal-row"><span class="label">Goal</span><span id="goal">—</span></div>
    <div class="step-box">
      <span id="counter" class="label"></span>
      <p id="step">Press the hotkey, then type or speak what you want to do. I'll point — you click.</p>
    </div>

    <div class="controls">
      <button id="btn-repeat" disabled>Repeat</button>
      <button id="btn-next" disabled>Next step</button>
      <button id="btn-stop">Stop</button>
    </div>
    <div id="status"></div>
  </section>

  <script src="phash.js"></script>
  <script src="voice.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
