<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Glance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Drag guide: dashed path from press point to release point + moving ghost cursor -->
  <div id="drag-layer" hidden><svg id="drag-svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="arrow-head" />
      </marker>
    </defs>
    <line id="drag-line" marker-end="url(#arrow)" />
    <rect id="drag-box" />
  </svg></div>
  <div id="drag-end" hidden><div class="ring"></div><span>release</span></div>
  <div id="drag-ghost" hidden></div>

  <!-- Pointer reticle (press / click point) -->
  <div id="reticle" hidden>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="dot"></div>
    <div id="scroll-arrows" hidden><i>▼</i><i>▼</i></div>
    <div id="reticle-label" hidden>
      <span id="label-action"></span>
      <span id="label-hint"></span>
      <code id="label-text" hidden></code>
    </div>
  </div>

  <!-- Calibration markers (type "calibrate" in the bar) -->
  <div id="calib" hidden></div>

  <!-- The only UI: a thin type bar -->
  <form id="bar" class="interactive" autocomplete="off">
    <span id="dot" data-s="idle"></span>
    <input id="bar-input" type="text" spellcheck="false" />
    <button type="button" id="mic" title="Speak">🎙</button>
  </form>

  <script src="phash.js"></script>
  <script src="watcher.js"></script>
  <script src="voice.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
